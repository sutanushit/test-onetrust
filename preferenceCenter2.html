<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preference Center</title>
  <style>
    :root {
        font-size: 10px;
        font-family: Arial Rounded MT for SE, Arial Rounded MT Fallback, Arial Fallback, Arial, system-ui, -apple-system, sans-serif;
    }
             .session-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #d9d9d9;
            font-size: 1.4rem;
        }

        .session-email {
            color: #222;
            word-break: break-all;
        }

        .logout-btn {
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            background: #3DCD58;
            cursor: pointer;
            font-size: 1.3rem;
            margin-left: auto;
        }

        .main-layout {
            display: flex;
            min-height: calc(100vh - 58px);
        }

        .left-panel {
            width: 220px;
            border-right: 1px solid #d9d9d9;
            padding: 16px 12px;
            box-sizing: border-box;
            background: #fafafa;
        }

        .tab-btn {
            width: 100%;
            text-align: left;
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 1.4rem;
            cursor: pointer;
            margin-bottom: 10px;
            color: #333;
        }

        .tab-btn.active {
            background: #3DCD58;
            color: #fff;
            border-color: #3DCD58;
        }

        .content-panel {
            flex: 1;
            padding: 16px;
            box-sizing: border-box;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .mobile-placeholder {
            border: 1px dashed #bdbdbd;
            border-radius: 10px;
            padding: 20px;
            font-size: 1.5rem;
            color: #555;
            background: #fff;
        }

        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }

            .left-panel {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid #d9d9d9;
                display: flex;
                gap: 10px;
            }

            .tab-btn {
                margin-bottom: 0;
            }
        }
  </style>
  <script>
    let userToken = localStorage.getItem('userToken');
    let userEmail = localStorage.getItem('userEmail');
    if (userEmail && userToken) {
    	var OneTrust = {
    		dataSubjectParams: {
    			id: userEmail,
    			isAnonymous: false,
                token: userToken
    		}
    	};
    }
      
    /* Page language */
    const pageParams = new URLSearchParams(window.location.search);
    const pagelangCode = pageParams.get('language');
    if(pagelangCode){
        document.documentElement.lang = pagelangCode;
    }
      
  </script>
</head>
<body>

    <div class="session-bar">
        <div id="sessionEmail" class="session-email"><span id="userEmailText"></span></div>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </div>

    <div class="main-layout">
        <aside class="left-panel">
            <button id="emailTab" class="tab-btn active" type="button" data-target="emailContent">Email</button>
            <button id="mobileTab" class="tab-btn" type="button" data-target="mobileContent">Mobile</button>
        </aside>

        <section class="content-panel">
            <div id="emailContent" class="tab-content active">
                <trust-center
                tenantId="221db9bd-276f-4f86-8e1c-53c7d470edee"
                portalId="80e08adf-239e-4dae-bc03-de6c1c97bc05"
                blobUrl="https://testcomplianceportal.se.com"
                workerUrl="https://portal-api.onetrust.com"
                ></trust-center>
            </div>

            <div id="mobileContent" class="tab-content">
                <trust-center
                tenantId="221db9bd-276f-4f86-8e1c-53c7d470edee"
                portalId="36707a95-2d18-4841-98c5-0c59570bf048"
                blobUrl="https://testcomplianceportal.se.com"
                workerUrl="https://portal-api.onetrust.com"
                ></trust-center>
            </div>
        </section>
    </div>

    <script
    id="portalSdkScript"
    src="https://testcomplianceportal.se.com/portal-trust-center/trust-center/scripts/portal-sdk.js"
    type="text/javascript"
    ></script>

    <script>
        const emailText = document.getElementById('userEmailText');
        const sessionEmail = document.getElementById('sessionEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        const storedEmail = localStorage.getItem('userEmail');

        if (storedEmail) {
            emailText.textContent = 'Signed in as: ' + storedEmail;
            logoutBtn.textContent = 'Logout';
        } else {
            sessionEmail.style.display = 'none';
            logoutBtn.textContent = 'Login';
        }

        logoutBtn.addEventListener('click', function () {
            if (storedEmail) {
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userToken');
                sessionStorage.removeItem('token');
            }
            window.location.href = 'login.html';
        });

        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');
        function refreshTrustCenter(targetId) {
            const targetContent = document.getElementById(targetId);
            if (!targetContent) {
                return;
            }

            const existingTrustCenter = targetContent.querySelector('trust-center');
            if (!existingTrustCenter) {
                return;
            }

            const clonedTrustCenter = existingTrustCenter.cloneNode(true);
            existingTrustCenter.replaceWith(clonedTrustCenter);
        }

        function activateTab(targetId) {
            const previousActive = document.querySelector('.tab-content.active');
            const wasTargetActive = previousActive && previousActive.id === targetId;

            tabButtons.forEach(function (button) {
                button.classList.toggle('active', button.dataset.target === targetId);
            });

            tabContents.forEach(function (content) {
                content.classList.toggle('active', content.id === targetId);
            });

            if ((targetId === 'mobileContent' || targetId === 'emailContent') && !wasTargetActive) {
                refreshTrustCenter(targetId);
            }
        }

        tabButtons.forEach(function (button) {
            button.addEventListener('click', function () {
                activateTab(button.dataset.target);
            });
        });
    </script>

</body>
</html>
