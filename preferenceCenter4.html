<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preference Center</title>
    <style>
        :root {
            font-size: 10px;
            font-family: Arial Rounded MT for SE, Arial Rounded MT Fallback, Arial Fallback, Arial, system-ui, -apple-system, sans-serif;
        }

        .session-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #d9d9d9;
            font-size: 1.4rem;
        }

        .session-email {
            color: #222;
            word-break: break-all;
        }

        .logout-btn {
            border: 0;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            background: #3DCD58;
            cursor: pointer;
            font-size: 1.3rem;
            margin-left: auto;
        }

        .main-layout {
            display: flex;
            min-height: calc(100vh - 58px);
        }

        .left-panel {
            width: 220px;
            border-right: 1px solid #d9d9d9;
            padding: 16px 12px;
            box-sizing: border-box;
            background: #fafafa;
        }

        .tab-btn {
            width: 100%;
            text-align: left;
            border: 1px solid #d9d9d9;
            background: #fff;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 1.4rem;
            cursor: pointer;
            margin-bottom: 10px;
            color: #333;
        }

        .tab-btn.active {
            background: #3DCD58;
            color: #fff;
            border-color: #3DCD58;
        }

        .content-panel {
            flex: 1;
            padding: 16px;
            box-sizing: border-box;
        }

        .trust-center-host {
            min-height: 300px;
        }

        @media (max-width: 768px) {
            .main-layout {
                flex-direction: column;
            }

            .left-panel {
                width: 100%;
                border-right: 0;
                border-bottom: 1px solid #d9d9d9;
                display: flex;
                gap: 10px;
            }

            .tab-btn {
                margin-bottom: 0;
            }
        }
    </style>
    <script>
        /* Page language */
        const pageParams = new URLSearchParams(window.location.search);
        const pagelangCode = pageParams.get('language');
        if (pagelangCode) {
            document.documentElement.lang = pagelangCode;
        }

        const seTrustCenterConfig = {
            tenantId: '221db9bd-276f-4f86-8e1c-53c7d470edee',
            blobUrl: 'https://testcomplianceportal.se.com',
            workerUrl: 'https://portal-api.onetrust.com',
            mobilePortalId: '36707a95-2d18-4841-98c5-0c59570bf048',
            emailPortalId: '80e08adf-239e-4dae-bc03-de6c1c97bc05'
        };

        const seDataSubject = {
            email: localStorage.getItem('userEmail'),
            mobile: localStorage.getItem('userMobile'),
            userEmailToken: localStorage.getItem('userEmailToken'),
            userMobileToken: localStorage.getItem('userMobileToken')
        };

        const seTrustCenterSession = {
            emailToken: null,
            mobileToken: null
        };

        var OneTrust = {};

        const setDataSubjectParams = (channel) => {
            if (channel === 'email') {
                OneTrust.dataSubjectParams = {
                    id: seDataSubject.email,
                    isAnonymous: false,
                    token: seDataSubject.userEmailToken
                };
            } else if (channel === 'mobile') {
                OneTrust.dataSubjectParams = {
                    id: seDataSubject.mobile,
                    isAnonymous: false,
                    token: seDataSubject.userMobileToken
                };
            }
        };

        const logoutSETrustCenter = () => {
            sessionStorage.removeItem('token');
        };

        const setTrustCenterSession = (channel) => {
            const otTrustCenterToken = sessionStorage.getItem('token');
            logoutSETrustCenter();
            if (channel === 'email') {
                if (otTrustCenterToken) {
                    seTrustCenterSession.mobileToken = otTrustCenterToken;
                }
                if (seTrustCenterSession.emailToken) {
                    sessionStorage.setItem('token', seTrustCenterSession.emailToken);
                } else if (seDataSubject.userEmailToken) {
                    setDataSubjectParams('email');
                }
            } else if (channel === 'mobile') {
                if (otTrustCenterToken) {
                    seTrustCenterSession.emailToken = otTrustCenterToken;
                }
                if (seTrustCenterSession.mobileToken) {
                    sessionStorage.setItem('token', seTrustCenterSession.mobileToken);
                } else if (seDataSubject.userMobileToken) {
                    setDataSubjectParams('mobile');
                }
            }
        };

        const loadTrustCenterWebComponent = (channel = 'email') => {
            const trustCenterHost = document.getElementById('trustCenterHost');

            trustCenterHost.querySelectorAll('trust-center').forEach(function (element) {
                element.remove();
            });

            const trustCenter = document.createElement('trust-center');
            trustCenter.setAttribute('tenantId', seTrustCenterConfig.tenantId);
            trustCenter.setAttribute('blobUrl', seTrustCenterConfig.blobUrl);
            trustCenter.setAttribute('workerUrl', seTrustCenterConfig.workerUrl);

            if (channel === 'email') {
                trustCenter.setAttribute('portalId', seTrustCenterConfig.emailPortalId);
            } else if (channel === 'mobile') {
                trustCenter.setAttribute('portalId', seTrustCenterConfig.mobilePortalId);
            }
            trustCenterHost.appendChild(trustCenter);

            (function () {
                var existingScript = document.getElementById("trustCenterSdkScript");
                if (existingScript) {
                    existingScript.remove();
                }

                var script = document.createElement("script");
                script.id = "trustCenterSdkScript";
                script.src = "https://testcomplianceportal.se.com/portal-trust-center/trust-center/scripts/trust-center-sdk.js";
                script.type = "text/javascript";
                script.charset = "utf-8";
                document.head.appendChild(script);
            })();
        };

    </script>
</head>

<body>

    <div class="session-bar">
        <div id="sessionEmail" class="session-email"><span id="userEmailText"></span></div>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </div>

    <div class="main-layout">
        <aside class="left-panel">
            <button id="emailTab" class="tab-btn active" type="button" data-target="emailContent">Email</button>
            <button id="mobileTab" class="tab-btn" type="button" data-target="mobileContent">Mobile</button>
        </aside>

        <section class="content-panel">
            <div id="trustCenterHost" class="trust-center-host"></div>
        </section>
    </div>

    <script>
        const emailText = document.getElementById('userEmailText');
        const sessionEmail = document.getElementById('sessionEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        const storedEmail = localStorage.getItem('userEmail');


        if (storedEmail) {
            emailText.textContent = 'Signed in as: ' + storedEmail;
            logoutBtn.textContent = 'Logout';
        } else {
            sessionEmail.style.display = 'none';
            logoutBtn.textContent = 'Login';
        }

        logoutBtn.addEventListener('click', function () {
            if (storedEmail) {
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userEmailToken');
                localStorage.removeItem('userMobile');
                localStorage.removeItem('userMobileToken');
                sessionStorage.removeItem('token');
            }
            window.location.href = 'login4.html';
        });

        const tabButtons = document.querySelectorAll('.tab-btn');

        function renderTrustCenter(targetId) {
            
            if (targetId === 'emailContent') {
                setTrustCenterSession('email');
                loadTrustCenterWebComponent('email');
            }
            if (targetId === 'mobileContent') {
                setTrustCenterSession('mobile');
                loadTrustCenterWebComponent('mobile');
            }
        }

        function activateTab(targetId) {
            const activeButton = document.querySelector('.tab-btn.active');
            const wasTargetActive = activeButton && activeButton.dataset.target === targetId;

            tabButtons.forEach(function (button) {
                button.classList.toggle('active', button.dataset.target === targetId);
            });

            if ((targetId === 'mobileContent' || targetId === 'emailContent') && !wasTargetActive) {
                renderTrustCenter(targetId);
            }
        }

        tabButtons.forEach(function (button) {
            button.addEventListener('click', function () {
                activateTab(button.dataset.target);
            });
        });

        renderTrustCenter('emailContent');
    </script>

</body>

</html>
